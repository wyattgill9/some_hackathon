[package]
name = "pipeline"
version = "0.1.0"
edition = "2024"

[dependencies]
arrow-array = "60.1.0"
arrow-schema = "60.1.0"
foldhash = "0.2.0"
parquet = { version = "60.1.0", default-features = false, features = ["arrow"] }
rayon = "1.12.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"
